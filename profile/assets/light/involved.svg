<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300"><style>@keyframes d1{from{transform:translate(0,0)}to{transform:translate(70px,-40px)}}@keyframes d2{from{transform:translate(0,0)}to{transform:translate(-60px,50px)}}@keyframes pl{50%{opacity:.35}}.dot{animation:pl 2.2s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6efff"/><stop offset="1" stop-color="#f4eaff"/></linearGradient><filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.74"/><stop offset="1" stop-color="#fff" stop-opacity="0.44"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset=".5" stop-color="#fff" stop-opacity="0.4"/><stop offset="1" stop-color="#fff" stop-opacity="0.43"/></linearGradient><linearGradient id="sn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="sd" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#3b3f6b" flood-opacity="0.2"/></filter><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a84ff"/><stop offset=".55" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff375f"/></linearGradient></defs><clipPath id="cp"><rect width="1280" height="300" rx="30"/></clipPath><g clip-path="url(#cp)"><rect width="1280" height="300" fill="url(#bg)"/><g filter="url(#bl)"><circle cx="200" cy="150" r="210" fill="#64d2ff" fill-opacity="0.42" style="animation:d1 16s ease-in-out infinite alternate"/><circle cx="1060" cy="120" r="230" fill="#0a84ff" fill-opacity="0.42" style="animation:d2 19s